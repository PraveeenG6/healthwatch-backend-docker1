spring.application.name=health-monitor
spring.config.import=optional:file:.env[.properties],optional:file:healthmonitor/.env[.properties]
server.port=8081
# Use a local MongoDB database for an easy academic demo.
# You can override this with an environment variable named MONGODB_URI.
spring.data.mongodb.uri=mongodb+srv://root:root@healthwatch.ab23ymq.mongodb.net/?appName=HealthWatch
spring.data.mongodb.database=HealthWatch

# Basic alert thresholds used by HealthService.
app.alert.heart-rate.high=110
app.alert.heart-rate.low=45
app.alert.spo2.low=94
app.alert.temperature.high=38.5
app.alert.temperature.low=35.0

# Gemini API configuration for the patient chatbot.
# Set GEMINI_API_KEY in your environment or in healthmonitor/.env before running the backend.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.api.model=gemini-2.5-flash
gemini.api.max-output-tokens=350

# DL4J fall-detection training data.
app.ai.fall-dataset=classpath:data/fall-detection-training.csv
app.ai.training-epochs=250
app.ai.fall-threshold=0.70

logging.level.com.healthmonitor=INFO
logging.level.org.springframework.data.mongodb=WARN
